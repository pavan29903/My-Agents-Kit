name: checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
        exclude:
          # Ubuntu 26.04 runners no longer ship Python 3.9; Windows still covers 3.9.
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Unit tests
        shell: bash
        run: |
          python -m unittest discover -s tests -v > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ "$status" != 0 ]; then
            # Logs need a sign-in; annotations are public, so failures are readable from the checks page.
            python -c "import sys; t=open('test-output.txt', encoding='utf-8', errors='replace').read(); i=t.find('======'); body=(t[i:] if i >= 0 else t)[-8000:]; print('::error title=unit tests::' + body.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))"
          fi
          exit $status
      - run: python scripts/kit.py validate
      - name: Lock file matches skills on disk
        run: |
          python -c "import json,sys; sys.path.insert(0,'scripts'); import kit; bad=[s for s,e in kit.load_lock()['skills'].items() if not (kit.SKILLS/s/'SKILL.md').is_file()]; sys.exit('missing: %s' % bad if bad else 0)"
